<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编码/解码</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --accent-green: var(--color-green);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-xl) var(--space-lg);
        }

        h1, h2, h3 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-style: italic;
        }

        .converter {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            gap: var(--space-md);
            align-items: start;
        }

        @media (max-width: 700px) {
            .converter {
                grid-template-columns: 1fr;
            }
            .arrow {
                transform: rotate(90deg);
                margin: 0 auto;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
        }

        .panel-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.5rem;
            padding-top: 40px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: var(--bg-input);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
            transition: border-color var(--transition-fast);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .btn-row {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid rgba(20, 20, 19, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(20, 20, 19, 0.05);
        }

        .info-bar {
            margin-top: var(--space-lg);
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-md);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .info-item span {
            color: var(--accent);
            font-family: 'Consolas', monospace;
        }

        .tips {
            text-align: center;
            margin-top: var(--space-lg);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .copy-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--color-light);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .copy-hint.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Base64 编码/解码</h1>
            <p class="subtitle">文本与 Base64 格式互转</p>
        </header>

        <div class="converter">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">原文</span>
                    <div class="btn-row">
                        <button class="btn-secondary" onclick="clearInput()">清空</button>
                    </div>
                </div>
                <textarea id="input" placeholder="输入要编码或解码的文本..."></textarea>
                <div class="btn-row">
                    <button class="btn-primary" onclick="encode()">编码 →</button>
                </div>
            </div>

            <div class="arrow">⇄</div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Base64</span>
                    <div class="btn-row">
                        <button class="btn-secondary" onclick="copyOutput()">复制</button>
                    </div>
                </div>
                <textarea id="output" placeholder="Base64 结果..." readonly></textarea>
                <div class="btn-row">
                    <button class="btn-primary" onclick="decode()">← 解码</button>
                </div>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-item">
                输入长度: <span id="inputLen">0</span> 字符
            </div>
            <div class="info-item">
                输出长度: <span id="outputLen">0</span> 字符
            </div>
            <div class="info-item">
                扩展比例: <span id="ratio">-</span>
            </div>
        </div>

        <p class="tips">支持文本、URL、图片 Base64 互转</p>
    </div>

    <div class="copy-hint" id="copyHint">已复制到剪贴板</div>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const inputLenEl = document.getElementById('inputLen');
        const outputLenEl = document.getElementById('outputLen');
        const ratioEl = document.getElementById('ratio');

        function updateStats() {
            const inputLen = new Blob([inputEl.value]).size;
            const outputLen = new Blob([outputEl.value]).size;
            inputLenEl.textContent = inputLen;
            outputLenEl.textContent = outputLen;
            if (inputLen > 0) {
                ratioEl.textContent = (outputLen / inputLen).toFixed(2) + 'x';
            } else {
                ratioEl.textContent = '-';
            }
        }

        function encode() {
            try {
                const text = inputEl.value;
                if (!text) return;
                outputEl.value = btoa(unescape(encodeURIComponent(text)));
                updateStats();
            } catch (e) {
                outputEl.value = '编码失败: ' + e.message;
            }
        }

        function decode() {
            try {
                const text = outputEl.value.trim();
                if (!text) return;
                inputEl.value = decodeURIComponent(escape(atob(text)));
                updateStats();
            } catch (e) {
                inputEl.value = '解码失败: 请确保输入是有效的 Base64 字符串';
            }
        }

        function clearInput() {
            inputEl.value = '';
            outputEl.value = '';
            updateStats();
        }

        function copyOutput() {
            const text = outputEl.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const hint = document.getElementById('copyHint');
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 1500);
            });
        }

        inputEl.addEventListener('input', updateStats);
        outputEl.addEventListener('input', updateStats);

        inputEl.addEventListener('paste', () => {
            setTimeout(() => {
                const text = inputEl.value;
                if (/^[A-Za-z0-9+/]+={0,2}$/.test(text.trim())) {
                    outputEl.value = text;
                    updateStats();
                }
            }, 100);
        });
    </script>
</body>
</html>
