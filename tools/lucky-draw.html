<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽签 - Lucky Draw</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --accent-green: var(--color-green);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        header {
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-style: italic;
            margin-top: var(--space-xs);
        }

        .input-section {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: var(--bg-input);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            transition: border-color var(--transition-fast);
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .btn-row {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid rgba(20, 20, 19, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(20, 20, 19, 0.05);
        }

        .result-box {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: var(--space-lg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .result-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
            z-index: 1;
        }

        .result-text.empty {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 1rem;
        }

        .animation {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(217, 119, 87, 0.1) 50%, transparent 60%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
            flex-wrap: wrap;
        }

        .settings label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 70px;
            padding: var(--space-sm);
            background: var(--bg-input);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .tips {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>随机抽签</h1>
            <p class="subtitle">从列表中随机抽取选项</p>
        </header>

        <div class="input-section">
            <textarea id="items" placeholder="每行输入一个选项&#10;例如：&#10;张三&#10;李四&#10;王五"></textarea>
            <div class="btn-row">
                <button class="btn-secondary" onclick="addExample()">示例</button>
                <button class="btn-secondary" onclick="clearAll()">清空</button>
            </div>
        </div>

        <div class="settings">
            <label>
                抽取数量:
                <input type="number" id="count" value="1" min="1" max="100">
            </label>
            <label>
                <input type="checkbox" id="unique" checked>
                不重复抽取
            </label>
        </div>

        <div class="btn-row">
            <button class="btn-primary" id="drawBtn" onclick="draw()">开始抽签</button>
        </div>

        <div class="result-box">
            <div class="animation" id="anim" style="display:none;"></div>
            <span class="result-text empty" id="result">输入选项后点击抽签</span>
        </div>

        <p class="tips">支持粘贴多条内容，用换行分隔</p>
    </div>

    <script>
        let drawnItems = [];

        function addExample() {
            document.getElementById('items').value = '苹果\n香蕉\n橙子\n葡萄\n西瓜\n草莓\n芒果\n菠萝';
        }

        function clearAll() {
            document.getElementById('items').value = '';
            document.getElementById('result').textContent = '输入选项后点击抽签';
            document.getElementById('result').className = 'result-text empty';
            drawnItems = [];
        }

        function draw() {
            const text = document.getElementById('items').value.trim();
            if (!text) {
                document.getElementById('result').textContent = '请先输入选项';
                return;
            }

            const items = text.split('\n').filter(item => item.trim());
            if (items.length === 0) {
                document.getElementById('result').textContent = '请输入有效选项';
                return;
            }

            const count = parseInt(document.getElementById('count').value) || 1;
            const unique = document.getElementById('unique').checked;

            if (unique && count > items.length) {
                document.getElementById('result').textContent = '抽取数量不能超过选项总数';
                return;
            }

            const btn = document.getElementById('drawBtn');
            const resultEl = document.getElementById('result');
            const anim = document.getElementById('anim');

            btn.disabled = true;
            anim.style.display = 'block';
            resultEl.className = 'result-text';

            let available = unique ? [...items] : items;
            if (unique) {
                drawnItems = [];
            }

            const finalResults = [];
            for (let i = 0; i < count; i++) {
                let pool = unique ? available : items;
                const randomIndex = Math.floor(Math.random() * pool.length);
                const selected = pool[randomIndex];
                finalResults.push(selected);

                if (unique) {
                    available.splice(randomIndex, 1);
                }
            }

            let animationInterval;
            animationInterval = setInterval(() => {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                resultEl.textContent = randomItem;
            }, 80);

            setTimeout(() => {
                clearInterval(animationInterval);
                anim.style.display = 'none';
                btn.disabled = false;

                if (count === 1) {
                    resultEl.textContent = finalResults[0];
                } else {
                    resultEl.innerHTML = finalResults.map(item => `· ${item}`).join('<br>');
                    if (unique) drawnItems = finalResults;
                }
            }, 1500);
        }

        document.getElementById('items').addEventListener('paste', () => {
            setTimeout(() => {
                drawnItems = [];
            }, 100);
        });
    </script>
</body>
</html>
