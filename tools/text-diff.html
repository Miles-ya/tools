<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本差异对比工具</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --accent-green: var(--color-green);
            --accent-red: #c94a4a;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-xl) var(--space-lg);
        }

        h1, h2, h3 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Controls */
        .controls {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-md) var(--space-lg);
            margin-bottom: var(--space-lg);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .mode-group {
            display: flex;
            gap: var(--space-sm);
        }

        .mode-btn {
            padding: 8px 16px;
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-sm);
            background: transparent;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .mode-btn.active {
            border-color: var(--accent-blue);
            background: rgba(106, 155, 204, 0.1);
            color: var(--accent-blue);
        }

        .mode-btn:hover:not(.active) {
            border-color: rgba(20, 20, 19, 0.2);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid rgba(20, 20, 19, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(20, 20, 19, 0.05);
        }

        .btn-export {
            background: var(--accent-green);
            color: var(--color-light);
        }

        .btn-export:hover {
            background: #6a7d4f;
            transform: translateY(-1px);
        }

        .legend {
            display: flex;
            gap: var(--space-md);
            margin-left: auto;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-dot.add { background: var(--accent-green); }
        .legend-dot.del { background: var(--accent-red); }
        .legend-dot.mod { background: var(--accent); }

        /* Panels */
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .panel-header {
            padding: var(--space-md) var(--space-lg);
            background: rgba(0, 0, 0, 0.02);
            border-bottom: 1px solid rgba(20, 20, 19, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .word-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .panel-body {
            padding: 0;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: none;
            padding: var(--space-md);
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        textarea:focus {
            background: rgba(0, 0, 0, 0.1);
        }

        /* Result */
        .result {
            background: var(--bg-card);
            border: 1px solid rgba(176, 174, 165, 0.15);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .result-header {
            padding: var(--space-md) var(--space-lg);
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(176, 174, 165, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .stats {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: var(--space-md);
        }

        .stats .add { color: var(--accent-green); }
        .stats .del { color: var(--accent-red); }
        .stats .mod { color: var(--accent); }

        .result-body {
            padding: var(--space-md);
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            max-height: 400px;
            overflow: auto;
        }

        .diff-line {
            padding: 2px 8px;
            border-radius: 4px;
            margin: 1px 0;
        }

        .diff-add {
            background: rgba(120, 141, 93, 0.2);
            color: var(--accent-green);
        }

        .diff-del {
            background: rgba(201, 74, 74, 0.15);
            color: var(--accent-red);
            text-decoration: line-through;
        }

        .diff-mod {
            background: rgba(217, 119, 87, 0.15);
            color: var(--accent);
        }

        .diff-same {
            color: var(--text-muted);
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: var(--space-xl);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>文本差异对比工具</h1>
        </header>

        <div class="controls">
            <div class="mode-group">
                <button class="mode-btn active" data-mode="side">并排对比</button>
                <button class="mode-btn" data-mode="unified">合并对比</button>
            </div>
            <button class="btn btn-primary" onclick="compare()">开始对比</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            <button class="btn btn-export" onclick="exportResult()">导出结果</button>
            <div class="legend">
                <span><div class="legend-dot add"></div> 新增</span>
                <span><div class="legend-dot del"></div> 删除</span>
                <span><div class="legend-dot mod"></div> 修改</span>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">原文</span>
                    <span class="word-count" id="leftCount">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="leftText" placeholder="在此粘贴原始文本...
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">修改后</span>
                    <span class="word-count" id="rightCount">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="rightText" placeholder="在此粘贴修改后的文本...
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
        </div>

        <div class="result">
            <div class="result-header">
                <span class="panel-title">对比结果</span>
                <span class="stats" id="resultStats"></span>
            </div>
            <div class="result-body" id="resultBody">
                <div class="empty-state">点击"开始对比"查看差异</div>
            </div>
        </div>
    </div>

    <script>
        const leftText = document.getElementById('leftText');
        const rightText = document.getElementById('rightText');
        const resultBody = document.getElementById('resultBody');
        const resultStats = document.getElementById('resultStats');
        let currentMode = 'side';
        let compareResult = [];

        // Paste support
        document.addEventListener('paste', (e) => {
            const text = e.clipboardData.getData('text');
            if (text) {
                if (document.activeElement === leftText || document.activeElement === rightText) return;
                leftText.value = text;
                updateCounts();
            }
        });

        leftText.addEventListener('input', updateCounts);
        rightText.addEventListener('input', updateCounts);

        function updateCounts() {
            const leftLines = leftText.value.split('\n').length;
            const rightLines = rightText.value.split('\n').length;
            document.getElementById('leftCount').textContent = `${leftLines} 行`;
            document.getElementById('rightCount').textContent = `${rightLines} 行`;
        }

        // Mode switching
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                if (compareResult.length > 0) {
                    renderResult();
                }
            });
        });

        // Simple diff algorithm
        function computeDiff(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            const result = [];

            const m = lines1.length;
            const n = lines2.length;

            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (lines1[i - 1] === lines2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            let i = m, j = n;
            const diffs = [];

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && lines1[i - 1] === lines2[j - 1]) {
                    diffs.unshift({ type: 'same', left: lines1[i - 1], right: lines2[j - 1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    diffs.unshift({ type: 'add', left: null, right: lines2[j - 1] });
                    j--;
                } else {
                    diffs.unshift({ type: 'del', left: lines1[i - 1], right: null });
                    i--;
                }
            }

            return diffs;
        }

        // Optimize diff (detect modifications)
        function optimizeDiff(diffs) {
            const result = [];
            let i = 0;

            while (i < diffs.length) {
                if (diffs[i].type === 'del' &&
                    i + 1 < diffs.length && diffs[i + 1].type === 'add') {
                    result.push({
                        type: 'mod',
                        left: diffs[i].left,
                        right: diffs[i + 1].right
                    });
                    i += 2;
                } else {
                    result.push(diffs[i]);
                    i++;
                }
            }

            return result;
        }

        function compare() {
            const text1 = leftText.value;
            const text2 = rightText.value;

            if (!text1 && !text2) {
                resultBody.innerHTML = '<div class="empty-state">请输入文本进行对比</div>';
                resultStats.textContent = '';
                return;
            }

            const rawDiff = computeDiff(text1, text2);
            compareResult = optimizeDiff(rawDiff);

            renderResult();
        }

        function renderResult() {
            let html = '';
            let addCount = 0, delCount = 0, modCount = 0;

            if (currentMode === 'side') {
                html = '<table style="width:100%;border-collapse:collapse;">';
                compareResult.forEach(item => {
                    if (item.type === 'same') {
                        html += `<tr><td class="diff-line diff-same" style="border-bottom:1px solid rgba(176,174,165,0.1);">${escapeHtml(item.left)}</td></tr>`;
                    } else if (item.type === 'add') {
                        addCount++;
                        html += `<tr><td class="diff-line diff-add" style="border-bottom:1px solid rgba(176,174,165,0.1);">+ ${escapeHtml(item.right)}</td></tr>`;
                    } else if (item.type === 'del') {
                        delCount++;
                        html += `<tr><td class="diff-line diff-del" style="border-bottom:1px solid rgba(176,174,165,0.1);">- ${escapeHtml(item.left)}</td></tr>`;
                    } else if (item.type === 'mod') {
                        modCount++;
                        html += `<tr><td class="diff-line diff-del" style="border-bottom:1px solid rgba(176,174,165,0.1);">- ${escapeHtml(item.left)}</td></tr>`;
                        html += `<tr><td class="diff-line diff-add" style="border-bottom:1px solid rgba(176,174,165,0.1);">+ ${escapeHtml(item.right)}</td></tr>`;
                    }
                });
                html += '</table>';
            } else {
                compareResult.forEach(item => {
                    if (item.type === 'same') {
                        html += `<div class="diff-line diff-same">  ${escapeHtml(item.left)}</div>`;
                    } else if (item.type === 'add') {
                        addCount++;
                        html += `<div class="diff-line diff-add">+ ${escapeHtml(item.right)}</div>`;
                    } else if (item.type === 'del') {
                        delCount++;
                        html += `<div class="diff-line diff-del">- ${escapeHtml(item.left)}</div>`;
                    } else if (item.type === 'mod') {
                        modCount++;
                        html += `<div class="diff-line diff-del">- ${escapeHtml(item.left)}</div>`;
                        html += `<div class="diff-line diff-add">+ ${escapeHtml(item.right)}</div>`;
                    }
                });
            }

            resultBody.innerHTML = html || '<div class="empty-state">无差异</div>';
            resultStats.innerHTML = `
                <span class="add">新增 ${addCount} 行</span> |
                <span class="del">删除 ${delCount} 行</span> |
                <span class="mod">修改 ${modCount} 处</span>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            leftText.value = '';
            rightText.value = '';
            resultBody.innerHTML = '<div class="empty-state">点击"开始对比"查看差异</div>';
            resultStats.textContent = '';
            updateCounts();
        }

        function exportResult() {
            let content = '';
            compareResult.forEach(item => {
                if (item.type === 'same') {
                    content += `  ${item.left}\n`;
                } else if (item.type === 'add') {
                    content += `+ ${item.right}\n`;
                } else if (item.type === 'del') {
                    content += `- ${item.left}\n`;
                } else if (item.type === 'mod') {
                    content += `- ${item.left}\n`;
                    content += `+ ${item.right}\n`;
                }
            });

            if (!content) {
                alert('没有可导出的内容');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'diff_result.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
