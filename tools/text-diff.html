<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本差异对比工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .controls {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .mode-group {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            font-size: 0.9rem;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            border-color: #4299e1;
            background: #ebf8ff;
            color: #3182ce;
        }

        .mode-btn:hover:not(.active) {
            border-color: #cbd5e0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: #4299e1;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3182ce;
        }

        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-export {
            background: #48bb78;
            color: #fff;
        }

        .btn-export:hover {
            background: #38a169;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 20px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #4a5568;
            font-weight: 500;
        }

        .word-count {
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .panel-body {
            padding: 0;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: none;
            padding: 15px;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: #fff;
        }

        textarea:focus {
            background: #fafbfc;
        }

        .result {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .result-header {
            padding: 12px 20px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            font-size: 0.85rem;
            color: #718096;
        }

        .stats .add {
            color: #38a169;
        }

        .stats .del {
            color: #e53e3e;
        }

        .stats .mod {
            color: #dd6b20;
        }

        .result-body {
            padding: 15px;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            max-height: 400px;
            overflow: auto;
        }

        .diff-line {
            padding: 2px 8px;
            border-radius: 4px;
            margin: 1px 0;
        }

        .diff-add {
            background: #c6f6d5;
            color: #22543d;
        }

        .diff-del {
            background: #fed7d7;
            color: #742a2a;
            text-decoration: line-through;
        }

        .diff-mod {
            background: #feebc8;
            color: #744210;
        }

        .diff-same {
            color: #718096;
        }

        .empty-state {
            color: #a0aec0;
            text-align: center;
            padding: 40px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-left: 20px;
            font-size: 0.8rem;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-dot.add { background: #c6f6d5; }
        .legend-dot.del { background: #fed7d7; }
        .legend-dot.mod { background: #feebc8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本差异对比工具</h1>

        <div class="controls">
            <div class="mode-group">
                <button class="mode-btn active" data-mode="side">并排对比</button>
                <button class="mode-btn" data-mode="unified">合并对比</button>
            </div>
            <button class="btn btn-primary" onclick="compare()">开始对比</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            <button class="btn btn-export" onclick="exportResult()">导出结果</button>
            <div class="legend">
                <span><div class="legend-dot add"></div> 新增</span>
                <span><div class="legend-dot del"></div> 删除</span>
                <span><div class="legend-dot mod"></div> 修改</span>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">原文</span>
                    <span class="word-count" id="leftCount">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="leftText" placeholder="在此粘贴原始文本...
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">修改后</span>
                    <span class="word-count" id="rightCount">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="rightText" placeholder="在此粘贴修改后的文本...
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
        </div>

        <div class="result">
            <div class="result-header">
                <span class="panel-title">对比结果</span>
                <span class="stats" id="resultStats"></span>
            </div>
            <div class="result-body" id="resultBody">
                <div class="empty-state">点击"开始对比"查看差异</div>
            </div>
        </div>
    </div>

    <script>
        const leftText = document.getElementById('leftText');
        const rightText = document.getElementById('rightText');
        const resultBody = document.getElementById('resultBody');
        const resultStats = document.getElementById('resultStats');
        let currentMode = 'side';
        let compareResult = [];

        // 粘贴支持
        document.addEventListener('paste', (e) => {
            const text = e.clipboardData.getData('text');
            if (text) {
                if (document.activeElement === leftText || document.activeElement === rightText) return;
                leftText.value = text;
                updateCounts();
            }
        });

        leftText.addEventListener('input', updateCounts);
        rightText.addEventListener('input', updateCounts);

        function updateCounts() {
            const leftLines = leftText.value.split('\n').length;
            const rightLines = rightText.value.split('\n').length;
            document.getElementById('leftCount').textContent = `${leftLines} 行`;
            document.getElementById('rightCount').textContent = `${rightLines} 行`;
        }

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                if (compareResult.length > 0) {
                    renderResult();
                }
            });
        });

        // 简单 diff 算法
        function computeDiff(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            const result = [];

            // 使用 LCS 算法的简化版本
            const m = lines1.length;
            const n = lines2.length;

            // 构建 DP 表
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (lines1[i - 1] === lines2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // 回溯获取差异
            let i = m, j = n;
            const diffs = [];

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && lines1[i - 1] === lines2[j - 1]) {
                    diffs.unshift({ type: 'same', left: lines1[i - 1], right: lines2[j - 1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    diffs.unshift({ type: 'add', left: null, right: lines2[j - 1] });
                    j--;
                } else {
                    diffs.unshift({ type: 'del', left: lines1[i - 1], right: null });
                    i--;
                }
            }

            return diffs;
        }

        // 检测修改行（相邻的删除和新增）
        function optimizeDiff(diffs) {
            const result = [];
            let i = 0;

            while (i < diffs.length) {
                if (diffs[i].type === 'del' &&
                    i + 1 < diffs.length && diffs[i + 1].type === 'add') {
                    // 视为修改
                    result.push({
                        type: 'mod',
                        left: diffs[i].left,
                        right: diffs[i + 1].right
                    });
                    i += 2;
                } else {
                    result.push(diffs[i]);
                    i++;
                }
            }

            return result;
        }

        function compare() {
            const text1 = leftText.value;
            const text2 = rightText.value;

            if (!text1 && !text2) {
                resultBody.innerHTML = '<div class="empty-state">请输入文本进行对比</div>';
                resultStats.textContent = '';
                return;
            }

            const rawDiff = computeDiff(text1, text2);
            compareResult = optimizeDiff(rawDiff);

            renderResult();
        }

        function renderResult() {
            let html = '';
            let addCount = 0, delCount = 0, modCount = 0;

            if (currentMode === 'side') {
                // 并排模式
                html = '<table style="width:100%;border-collapse:collapse;">';
                compareResult.forEach(item => {
                    if (item.type === 'same') {
                        html += `<tr><td class="diff-line diff-same" style="border-bottom:1px solid #eee;">${escapeHtml(item.left)}</td></tr>`;
                    } else if (item.type === 'add') {
                        addCount++;
                        html += `<tr><td class="diff-line diff-add" style="border-bottom:1px solid #eee;">+ ${escapeHtml(item.right)}</td></tr>`;
                    } else if (item.type === 'del') {
                        delCount++;
                        html += `<tr><td class="diff-line diff-del" style="border-bottom:1px solid #eee;">- ${escapeHtml(item.left)}</td></tr>`;
                    } else if (item.type === 'mod') {
                        modCount++;
                        html += `<tr><td class="diff-line diff-del" style="border-bottom:1px solid #eee;">- ${escapeHtml(item.left)}</td></tr>`;
                        html += `<tr><td class="diff-line diff-add" style="border-bottom:1px solid #eee;">+ ${escapeHtml(item.right)}</td></tr>`;
                    }
                });
                html += '</table>';
            } else {
                // 合并模式
                compareResult.forEach(item => {
                    if (item.type === 'same') {
                        html += `<div class="diff-line diff-same">  ${escapeHtml(item.left)}</div>`;
                    } else if (item.type === 'add') {
                        addCount++;
                        html += `<div class="diff-line diff-add">+ ${escapeHtml(item.right)}</div>`;
                    } else if (item.type === 'del') {
                        delCount++;
                        html += `<div class="diff-line diff-del">- ${escapeHtml(item.left)}</div>`;
                    } else if (item.type === 'mod') {
                        modCount++;
                        html += `<div class="diff-line diff-del">- ${escapeHtml(item.left)}</div>`;
                        html += `<div class="diff-line diff-add">+ ${escapeHtml(item.right)}</div>`;
                    }
                });
            }

            resultBody.innerHTML = html || '<div class="empty-state">无差异</div>';
            resultStats.innerHTML = `
                <span class="add">新增 ${addCount} 行</span> |
                <span class="del">删除 ${delCount} 行</span> |
                <span class="mod">修改 ${modCount} 处</span>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            leftText.value = '';
            rightText.value = '';
            resultBody.innerHTML = '<div class="empty-state">点击"开始对比"查看差异</div>';
            resultStats.textContent = '';
            updateCounts();
        }

        function exportResult() {
            let content = '';
            compareResult.forEach(item => {
                if (item.type === 'same') {
                    content += `  ${item.left}\n`;
                } else if (item.type === 'add') {
                    content += `+ ${item.right}\n`;
                } else if (item.type === 'del') {
                    content += `- ${item.left}\n`;
                } else if (item.type === 'mod') {
                    content += `- ${item.left}\n`;
                    content += `+ ${item.right}\n`;
                }
            });

            if (!content) {
                alert('没有可导出的内容');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'diff_result.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
