<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应时间测试</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-green: var(--color-green);
            --accent-red: #c94a4a;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 50%;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 400;
            font-size: 1.8rem;
            margin-bottom: var(--space-xl);
            letter-spacing: 0.5px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .instruction {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
            min-height: 1.5rem;
        }

        .result {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: var(--space-sm);
            min-height: 3.5rem;
            font-family: 'Poppins', Arial, sans-serif;
        }

        #game-area {
            width: 280px;
            height: 280px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            margin: 0 auto var(--space-xl);
            border: 2px solid rgba(20, 20, 19, 0.1);
            font-size: 1.2rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        #game-area:hover {
            transform: scale(1.02);
            border-color: rgba(20, 20, 19, 0.2);
        }

        #game-area.waiting {
            background: #fef0ed;
            border-color: var(--accent-red);
        }

        #game-area.ready {
            background: #edf5ed;
            border-color: var(--accent-green);
        }

        #game-area.clicked {
            background: #fdf6ed;
            border-color: var(--accent);
        }

        .stats {
            display: flex;
            gap: var(--space-xl);
            justify-content: center;
            margin-top: var(--space-xl);
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Poppins', Arial, sans-serif;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }

        .history {
            margin-top: var(--space-xl);
            display: flex;
            gap: var(--space-xs);
            justify-content: center;
            flex-wrap: wrap;
            max-width: 400px;
        }

        .history-item {
            width: 12px;
            height: 12px;
            border-radius: var(--radius-full);
            background: #444;
        }

        .history-item.fast { background: var(--accent-green); }
        .history-item.slow { background: var(--accent-red); }

        .reset-btn {
            margin-top: var(--space-xl);
            padding: 10px 32px;
            font-size: 1rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 20px;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .reset-btn:hover {
            background: var(--accent);
            color: var(--color-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>反应时间测试</h1>

        <div class="instruction" id="instruction">点击圆圈开始测试</div>
        <div class="result" id="result">-</div>

        <div id="game-area">开始</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="best">-</div>
                <div class="stat-label">最佳 (ms)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avg">-</div>
                <div class="stat-label">平均 (ms)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="count">0</div>
                <div class="stat-label">测试次数</div>
            </div>
        </div>

        <div class="history" id="history"></div>

        <button class="reset-btn" id="reset">重置数据</button>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const instruction = document.getElementById('instruction');
        const result = document.getElementById('result');
        const bestEl = document.getElementById('best');
        const avgEl = document.getElementById('avg');
        const countEl = document.getElementById('count');
        const historyEl = document.getElementById('history');
        const resetBtn = document.getElementById('reset');

        let state = 'idle';
        let startTime = 0;
        let timeoutId = null;
        let results = [];

        gameArea.addEventListener('click', handleClick);
        resetBtn.addEventListener('click', resetData);

        function handleClick() {
            switch (state) {
                case 'idle':
                    startGame();
                    break;
                case 'waiting':
                    failGame('太急了，等绿色出现再点！');
                    break;
                case 'ready':
                    endGame();
                    break;
            }
        }

        function startGame() {
            state = 'waiting';
            gameArea.className = 'waiting';
            gameArea.textContent = '等待...';
            instruction.textContent = '看到绿色就点击！';

            const delay = 1500 + Math.random() * 2500;

            timeoutId = setTimeout(() => {
                state = 'ready';
                gameArea.className = 'ready';
                gameArea.textContent = '点击！';
                instruction.textContent = '快！';
                startTime = performance.now();
            }, delay);
        }

        function endGame() {
            const reactionTime = Math.round(performance.now() - startTime);
            state = 'idle';
            gameArea.className = '';
            gameArea.textContent = '再来一次';

            results.push(reactionTime);
            updateStats();
            updateHistory(reactionTime);

            result.textContent = reactionTime + ' ms';
            instruction.textContent = reactionTime < 200 ? '超快！' : reactionTime < 300 ? '不错！' : '再来一次？';
        }

        function failGame(msg) {
            clearTimeout(timeoutId);
            state = 'idle';
            gameArea.className = 'clicked';
            gameArea.textContent = '再来';
            result.textContent = '失败';
            instruction.textContent = msg;

            setTimeout(() => {
                gameArea.className = '';
            }, 500);
        }

        function updateStats() {
            if (results.length === 0) return;

            const best = Math.min(...results);
            const avg = Math.round(results.reduce((a, b) => a + b, 0) / results.length);

            bestEl.textContent = best;
            avgEl.textContent = avg;
            countEl.textContent = results.length;
        }

        function updateHistory(time) {
            const dot = document.createElement('div');
            dot.className = 'history-item' + (time < 250 ? ' fast' : time > 400 ? ' slow' : '');
            dot.title = time + ' ms';
            historyEl.appendChild(dot);

            while (historyEl.children.length > 20) {
                historyEl.removeChild(historyEl.firstChild);
            }
        }

        function resetData() {
            results = [];
            bestEl.textContent = '-';
            avgEl.textContent = '-';
            countEl.textContent = '0';
            historyEl.innerHTML = '';
            result.textContent = '-';
            instruction.textContent = '点击圆圈开始测试';
            state = 'idle';
            gameArea.className = '';
            gameArea.textContent = '开始';
        }
    </script>
</body>
</html>
