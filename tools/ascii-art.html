<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII 艺术生成器</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-xl) var(--space-lg);
        }

        h1, h2, h3 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-style: italic;
            margin-top: var(--space-xs);
        }

        .upload-area {
            border: 2px dashed rgba(20, 20, 19, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            text-align: center;
            margin-bottom: var(--space-xl);
            transition: all var(--transition-normal);
            cursor: pointer;
            background: var(--bg-card);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(217, 119, 87, 0.03);
        }

        .upload-area p {
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }

        .upload-btn {
            padding: 10px 32px;
            background: var(--accent);
            border: none;
            border-radius: 20px;
            color: var(--color-light);
            cursor: pointer;
            font-size: 1rem;
            transition: all var(--transition-fast);
        }

        .upload-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        #fileInput {
            display: none;
        }

        .controls {
            display: flex;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .control-group input[type="range"] {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-input);
            border-radius: 3px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .control-group select {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .control-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .output-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }

        @media (max-width: 768px) {
            .output-container {
                grid-template-columns: 1fr;
            }
        }

        .output-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            border: 1px solid rgba(20, 20, 19, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .output-box h3 {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-box pre {
            background: var(--bg-input);
            padding: var(--space-md);
            border-radius: var(--radius-sm);
            overflow: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 8px;
            line-height: 1;
            white-space: pre;
            max-height: 400px;
            word-break: break-all;
        }

        .copy-btn {
            padding: 4px 12px;
            background: var(--bg-input);
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .copy-btn:hover {
            background: var(--accent);
            color: var(--color-light);
        }

        .preview-img {
            max-width: 200px;
            max-height: 200px;
            margin-bottom: var(--space-md);
            border-radius: var(--radius-sm);
        }

        .hidden {
            display: none !important;
        }

        .actions {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            margin-top: var(--space-xl);
        }

        .btn {
            padding: 12px 32px;
            border-radius: 20px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: var(--color-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ASCII 字符画</h1>
            <p class="subtitle">将图片转换为 ASCII 字符艺术</p>
        </header>

        <div class="upload-area" id="uploadArea">
            <p>拖拽图片到这里，或点击选择图片</p>
            <button class="upload-btn">选择图片</button>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <img id="previewImg" class="preview-img hidden">

        <div class="controls">
            <div class="control-group">
                <label>宽度: <span id="widthValue">100</span> 字符</label>
                <input type="range" id="widthSlider" min="20" max="200" value="100">
            </div>

            <div class="control-group">
                <label>字符集</label>
                <select id="charSet">
                    <option value="simple">简单 (@%#*+=-:. )</option>
                    <option value="complex">复杂 ($@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~&lt;&gt;i!lI;:,"^`'. )</option>
                    <option value="blocks">方块 (█▓▒░ )</option>
                    <option value="binary">二进制 (01)</option>
                    <option value="hearts">爱心 (♥♡)</option>
                </select>
            </div>

            <div class="control-group">
                <label>反转颜色</label>
                <select id="invert">
                    <option value="normal">正常</option>
                    <option value="invert">反转</option>
                </select>
            </div>
        </div>

        <div class="output-container">
            <div class="output-box">
                <h3>
                    ASCII 字符画
                    <button class="copy-btn" id="copyAscii">复制</button>
                </h3>
                <pre id="asciiOutput">上传图片后自动生成</pre>
            </div>

            <div class="output-box">
                <h3>
                    HTML 预览
                    <button class="copy-btn" id="copyHtml">复制</button>
                </h3>
                <pre id="htmlOutput" style="font-size: 6px; color: #d97757; background: #faf9f5;">上传图片后自动生成</pre>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="downloadBtn">下载为文本文件</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const widthSlider = document.getElementById('widthSlider');
        const widthValue = document.getElementById('widthValue');
        const charSetSelect = document.getElementById('charSet');
        const invertSelect = document.getElementById('invert');
        const asciiOutput = document.getElementById('asciiOutput');
        const htmlOutput = document.getElementById('htmlOutput');
        const copyAscii = document.getElementById('copyAscii');
        const copyHtml = document.getElementById('copyHtml');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImage = null;

        const charSets = {
            simple: '@%#*+=-:. ',
            complex: '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. ',
            blocks: '█▓▒░ ',
            binary: '01',
            hearts: '♥♡'
        };

        uploadArea.addEventListener('dragover', e => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) loadImage(e.target.files[0]);
        });

        widthSlider.addEventListener('input', () => {
            widthValue.textContent = widthSlider.value;
            if (currentImage) generateAscii();
        });

        charSetSelect.addEventListener('change', () => {
            if (currentImage) generateAscii();
        });

        invertSelect.addEventListener('change', () => {
            if (currentImage) generateAscii();
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    previewImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                    generateAscii();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function generateAscii() {
            if (!currentImage) return;

            const width = parseInt(widthSlider.value);
            const height = Math.floor(width * (currentImage.height / currentImage.width) / 2);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(currentImage, 0, 0, width, height);

            const imageData = ctx.getImageData(0, 0, width, height);
            const pixels = imageData.data;

            let chars = charSets[charSetSelect.value];
            if (invertSelect.value === 'invert') {
                chars = chars.split('').reverse().join('');
            }

            let ascii = '';
            let html = '';

            for (let y = 0; y < height; y++) {
                let line = '';
                let htmlLine = '';
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    const brightness = (r + g + b) / 3;
                    const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
                    const char = chars[charIndex];

                    line += char;
                    htmlLine += `<span style="color:rgb(${r},${g},${b})">${char}</span>`;
                }
                ascii += line + '\n';
                html += htmlLine + '<br>';
            }

            asciiOutput.textContent = ascii;
            htmlOutput.innerHTML = html;
        }

        copyAscii.addEventListener('click', () => {
            navigator.clipboard.writeText(asciiOutput.textContent);
            copyAscii.textContent = '已复制';
            setTimeout(() => copyAscii.textContent = '复制', 1500);
        });

        copyHtml.addEventListener('click', () => {
            const html = `<pre style="font-family:monospace;font-size:8px;line-height:1;white-space:pre;">${htmlOutput.innerHTML}</pre>`;
            navigator.clipboard.writeText(html);
            copyHtml.textContent = '已复制';
            setTimeout(() => copyHtml.textContent = '复制', 1500);
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([asciiOutput.textContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ascii-art.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
