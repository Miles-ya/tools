<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志筛选工具</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --accent-green: var(--color-green);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-xl) var(--space-lg);
        }

        h1, h2, h3 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .controls {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            align-items: flex-end;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xs);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid rgba(20, 20, 19, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(20, 20, 19, 0.05);
        }

        .btn-export {
            background: var(--accent-green);
            color: var(--color-light);
        }

        .btn-export:hover {
            background: #6a7d4f;
            transform: translateY(-1px);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid rgba(20, 20, 19, 0.1);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .panel-header {
            padding: var(--space-md) var(--space-lg);
            background: rgba(0, 0, 0, 0.02);
            border-bottom: 1px solid rgba(20, 20, 19, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .panel-body {
            padding: 0;
        }

        textarea {
            width: 100%;
            height: 400px;
            border: none;
            padding: var(--space-md);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        textarea:focus {
            background: rgba(0, 0, 0, 0.02);
        }

        .output-area {
            width: 100%;
            height: 400px;
            padding: var(--space-md);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow: auto;
            background: var(--bg-card);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .stats {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .highlight {
            background: rgba(217, 119, 87, 0.2);
            padding: 0 2px;
            border-radius: 2px;
        }

        .line-matched {
            background: rgba(120, 141, 93, 0.15);
        }

        .line-excluded {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>日志筛选工具</h1>
        </header>

        <div class="controls">
            <div class="input-group">
                <label>筛选前缀（支持多个，用逗号分隔）</label>
                <input type="text" id="filterPrefix" placeholder="例如: INFO, WARN, ERROR">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="useRegex">
                <label for="useRegex">使用正则表达式</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="excludeMode">
                <label for="excludeMode">排除模式（隐藏匹配行）</label>
            </div>
            <button class="btn btn-primary" onclick="filterLog()">筛选</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            <button class="btn btn-export" onclick="exportResult()">导出结果</button>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">原始日志</span>
                    <span class="stats" id="inputStats">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="inputLog" placeholder="在此粘贴日志内容...
支持拖拽文件到此处
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">筛选结果</span>
                    <span class="stats" id="outputStats">0 行</span>
                </div>
                <div class="panel-body">
                    <div class="output-area" id="outputLog"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputLog = document.getElementById('inputLog');
        const outputLog = document.getElementById('outputLog');
        const filterPrefix = document.getElementById('filterPrefix');
        const useRegex = document.getElementById('useRegex');
        const excludeMode = document.getElementById('excludeMode');

        document.addEventListener('paste', (e) => {
            if (document.activeElement === filterPrefix) return;
            const text = e.clipboardData.getData('text');
            if (text) {
                inputLog.value = text;
                updateStats();
            }
        });

        inputLog.addEventListener('dragover', (e) => {
            e.preventDefault();
            inputLog.style.background = 'rgba(120, 141, 93, 0.05)';
        });

        inputLog.addEventListener('dragleave', () => {
            inputLog.style.background = '';
        });

        inputLog.addEventListener('drop', (e) => {
            e.preventDefault();
            inputLog.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    inputLog.value = event.target.result;
                    updateStats();
                };
                reader.readAsText(file);
            }
        });

        inputLog.addEventListener('input', updateStats);

        function updateStats() {
            const lines = inputLog.value.split('\n').filter(line => line.length > 0);
            document.getElementById('inputStats').textContent = `${lines.length} 行`;
        }

        function filterLog() {
            const text = inputLog.value;
            const prefixes = filterPrefix.value.split(',').map(p => p.trim()).filter(p => p);

            if (!text) {
                outputLog.textContent = '';
                return;
            }

            const lines = text.split('\n');
            const results = [];
            let matchCount = 0;

            lines.forEach(line => {
                if (line.length === 0) {
                    if (!excludeMode.checked) {
                        results.push({ text: '', matched: false });
                    }
                    return;
                }

                let matched = false;

                if (useRegex.checked) {
                    try {
                        const regexes = prefixes.map(p => new RegExp(p, 'i'));
                        matched = regexes.some(regex => regex.test(line));
                    } catch (e) {
                        alert('正则表达式无效: ' + e.message);
                        return;
                    }
                } else {
                    matched = prefixes.some(prefix => line.startsWith(prefix));
                }

                if (excludeMode.checked) {
                    if (!matched) {
                        results.push({ text: line, matched: false });
                    } else {
                        matchCount++;
                    }
                } else {
                    if (matched) {
                        results.push({ text: line, matched: true });
                        matchCount++;
                    } else {
                        results.push({ text: line, matched: false });
                    }
                }
            });

            outputLog.innerHTML = results.map(r =>
                r.matched ? `<div class="line-matched">${escapeHtml(r.text)}</div>` :
                r.text === '' ? '<br>' : `<div class="line-excluded">${escapeHtml(r.text)}</div>`
            ).join('');

            document.getElementById('outputStats').textContent = `${results.filter(r => r.matched || (excludeMode.checked && r.text !== '')).length} 行`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            inputLog.value = '';
            outputLog.innerHTML = '';
            filterPrefix.value = '';
            updateStats();
            document.getElementById('outputStats').textContent = '0 行';
        }

        function exportResult() {
            const content = outputLog.innerText;
            if (!content) {
                alert('没有可导出的内容');
                return;
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'filtered_log.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
