<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志筛选工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .controls {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: #4a5568;
            cursor: pointer;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: #4299e1;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-export {
            background: #48bb78;
            color: #fff;
        }

        .btn-export:hover {
            background: #38a169;
            transform: translateY(-1px);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.95rem;
            color: #4a5568;
            font-weight: 500;
        }

        .panel-body {
            padding: 0;
        }

        textarea {
            width: 100%;
            height: 400px;
            border: none;
            padding: 15px;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: #fff;
        }

        textarea:focus {
            background: #fafbfc;
        }

        .output-area {
            width: 100%;
            height: 400px;
            padding: 15px;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow: auto;
            background: #fff;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .stats {
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .highlight {
            background: #fef3c7;
            padding: 0 2px;
            border-radius: 2px;
        }

        .line-matched {
            background: #c6f6d5;
        }

        .line-excluded {
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日志筛选工具</h1>

        <div class="controls">
            <div class="input-group">
                <label>筛选前缀（支持多个，用逗号分隔）</label>
                <input type="text" id="filterPrefix" placeholder="例如: INFO, WARN, ERROR">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="useRegex">
                <label for="useRegex">使用正则表达式</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="excludeMode">
                <label for="excludeMode">排除模式（隐藏匹配行）</label>
            </div>
            <button class="btn btn-primary" onclick="filterLog()">筛选</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            <button class="btn btn-export" onclick="exportResult()">导出结果</button>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">原始日志</span>
                    <span class="stats" id="inputStats">0 行</span>
                </div>
                <div class="panel-body">
                    <textarea id="inputLog" placeholder="在此粘贴日志内容...
支持拖拽文件到此处
支持 Ctrl+V 粘贴"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">筛选结果</span>
                    <span class="stats" id="outputStats">0 行</span>
                </div>
                <div class="panel-body">
                    <div class="output-area" id="outputLog"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputLog = document.getElementById('inputLog');
        const outputLog = document.getElementById('outputLog');
        const filterPrefix = document.getElementById('filterPrefix');
        const useRegex = document.getElementById('useRegex');
        const excludeMode = document.getElementById('excludeMode');

        // 粘贴支持
        document.addEventListener('paste', (e) => {
            // 只在焦点不在输入框时处理
            if (document.activeElement === filterPrefix) return;
            const text = e.clipboardData.getData('text');
            if (text) {
                inputLog.value = text;
                updateStats();
            }
        });

        // 拖拽支持
        inputLog.addEventListener('dragover', (e) => {
            e.preventDefault();
            inputLog.style.background = '#f0fff4';
        });

        inputLog.addEventListener('dragleave', () => {
            inputLog.style.background = '#fff';
        });

        inputLog.addEventListener('drop', (e) => {
            e.preventDefault();
            inputLog.style.background = '#fff';
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    inputLog.value = event.target.result;
                    updateStats();
                };
                reader.readAsText(file);
            }
        });

        inputLog.addEventListener('input', updateStats);

        function updateStats() {
            const lines = inputLog.value.split('\n').filter(line => line.length > 0);
            document.getElementById('inputStats').textContent = `${lines.length} 行`;
        }

        function filterLog() {
            const text = inputLog.value;
            const prefixes = filterPrefix.value.split(',').map(p => p.trim()).filter(p => p);

            if (!text) {
                outputLog.textContent = '';
                return;
            }

            const lines = text.split('\n');
            const results = [];
            let matchCount = 0;

            lines.forEach(line => {
                if (line.length === 0) {
                    if (!excludeMode.checked) {
                        results.push({ text: '', matched: false });
                    }
                    return;
                }

                let matched = false;

                if (useRegex.checked) {
                    try {
                        const regexes = prefixes.map(p => new RegExp(p, 'i'));
                        matched = regexes.some(regex => regex.test(line));
                    } catch (e) {
                        alert('正则表达式无效: ' + e.message);
                        return;
                    }
                } else {
                    matched = prefixes.some(prefix => line.startsWith(prefix));
                }

                if (excludeMode.checked) {
                    if (!matched) {
                        results.push({ text: line, matched: false });
                    } else {
                        matchCount++;
                    }
                } else {
                    if (matched) {
                        results.push({ text: line, matched: true });
                        matchCount++;
                    } else {
                        results.push({ text: line, matched: false });
                    }
                }
            });

            outputLog.innerHTML = results.map(r =>
                r.matched ? `<div class="line-matched">${escapeHtml(r.text)}</div>` :
                r.text === '' ? '<br>' : `<div class="line-excluded">${escapeHtml(r.text)}</div>`
            ).join('');

            document.getElementById('outputStats').textContent = `${results.filter(r => r.matched || (excludeMode.checked && r.text !== '')).length} 行`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            inputLog.value = '';
            outputLog.innerHTML = '';
            filterPrefix.value = '';
            updateStats();
            document.getElementById('outputStats').textContent = '0 行';
        }

        function exportResult() {
            const content = outputLog.innerText;
            if (!content) {
                alert('没有可导出的内容');
                return;
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'filtered_log.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 筛选功能仅通过按钮触发
    </script>
</body>
</html>
