<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片尺寸调整工具</title>
    <style>
        /* ========================================
           Light Theme Variables
           ======================================== */
        :root {
            --color-dark: #141413;
            --color-light: #faf9f5;
            --color-mid: #b0aea5;
            --color-orange: #d97757;
            --color-blue: #6a9bcc;
            --color-green: #788c5d;
            --bg-primary: var(--color-light);
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0eeea;
            --text-primary: var(--color-dark);
            --text-secondary: #5a5a52;
            --text-muted: #8a8a7e;
            --accent: var(--color-orange);
            --accent-hover: #c86a4a;
            --accent-blue: var(--color-blue);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-xl) var(--space-lg);
        }

        h1, h2, h3 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: var(--space-xl);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Upload Zone */
        .upload-zone {
            background: var(--bg-card);
            border: 2px dashed rgba(20, 20, 19, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: var(--space-lg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(217, 119, 87, 0.05);
        }

        .upload-zone p {
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
        }

        .upload-zone .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Workspace */
        .workspace {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--space-lg);
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Controls Panel */
        .controls {
            background: var(--bg-card);
            border: 1px solid rgba(176, 174, 165, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }

        .control-group {
            margin-bottom: var(--space-md);
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xs);
        }

        .control-group input[type="number"],
        .control-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid rgba(176, 174, 165, 0.2);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .control-group input[type="number"]:focus,
        .control-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: var(--space-sm);
        }

        .row .control-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .slider-group {
            margin-bottom: var(--space-md);
        }

        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-input);
            outline: none;
            -webkit-appearance: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: var(--radius-full);
            background: var(--accent);
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .slider-value {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: var(--space-xs);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            margin-bottom: var(--space-sm);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Size Presets */
        .size-presets {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-bottom: var(--space-md);
        }

        .preset-btn {
            padding: 4px 10px;
            border: 1px solid rgba(176, 174, 165, 0.2);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .preset-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Preview */
        .preview {
            background: var(--bg-card);
            border: 1px solid rgba(176, 174, 165, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            overflow: auto;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .preview-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .preview-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .preview-container {
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
        }

        .preview-container img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .placeholder {
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>图片尺寸调整工具</h1>
        </header>

        <div class="upload-zone" id="uploadZone">
            <p>点击或拖拽图片到此处</p>
            <p class="hint">支持 PNG、JPG、GIF、WebP | 也可 Ctrl+V 粘贴</p>
        </div>

        <div class="workspace hidden" id="workspace">
            <div class="controls">
                <div class="control-group">
                    <label>常用尺寸</label>
                    <div class="size-presets">
                        <button class="preset-btn" data-width="1920" data-height="1080">1080p</button>
                        <button class="preset-btn" data-width="1280" data-height="720">720p</button>
                        <button class="preset-btn" data-width="800" data-height="600">800×600</button>
                        <button class="preset-btn" data-width="400" data-height="300">400×300</button>
                        <button class="preset-btn" data-width="200" data-height="200">200×200</button>
                        <button class="preset-btn" data-width="100" data-height="100">100×100</button>
                    </div>
                </div>

                <div class="row">
                    <div class="control-group">
                        <label>宽度 (px)</label>
                        <input type="number" id="targetWidth" value="800" min="1" max="10000">
                    </div>
                    <div class="control-group">
                        <label>高度 (px)</label>
                        <input type="number" id="targetHeight" value="600" min="1" max="10000">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="maintainRatio" checked>
                    <label for="maintainRatio">保持宽高比</label>
                </div>

                <div class="slider-group">
                    <label>缩放比例</label>
                    <input type="range" id="scaleSlider" min="5" max="200" value="100">
                    <div class="slider-value"><span id="scaleValue">100</span>%</div>
                </div>

                <div class="control-group">
                    <label>输出格式</label>
                    <select id="outputFormat">
                        <option value="image/png">PNG</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/webp">WebP</option>
                    </select>
                </div>

                <div class="slider-group" id="qualityGroup">
                    <label>输出质量</label>
                    <input type="range" id="qualitySlider" min="10" max="100" value="90">
                    <div class="slider-value"><span id="qualityValue">90</span>%</div>
                </div>

                <button class="btn btn-primary" id="applyBtn">应用调整</button>
                <button class="btn btn-secondary" id="downloadBtn">下载图片</button>
                <button class="btn btn-secondary" id="resetBtn">重新选择</button>
            </div>

            <div class="preview">
                <div class="preview-header">
                    <span class="preview-title">预览</span>
                    <span class="preview-info" id="previewInfo"></span>
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="previewImg" src="" alt="Preview">
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const workspace = document.getElementById('workspace');
        const targetWidth = document.getElementById('targetWidth');
        const targetHeight = document.getElementById('targetHeight');
        const maintainRatio = document.getElementById('maintainRatio');
        const scaleSlider = document.getElementById('scaleSlider');
        const scaleValue = document.getElementById('scaleValue');
        const outputFormat = document.getElementById('outputFormat');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const qualityGroup = document.getElementById('qualityGroup');
        const previewImg = document.getElementById('previewImg');
        const previewInfo = document.getElementById('previewInfo');
        const previewContainer = document.getElementById('previewContainer');

        let originalImage = null;
        let originalWidth = 0;
        let originalHeight = 0;
        let aspectRatio = 0;

        function updateQualityVisibility() {
            const format = outputFormat.value;
            qualityGroup.style.display = format === 'image/png' ? 'none' : 'block';
        }
        outputFormat.addEventListener('change', updateQualityVisibility);
        updateQualityVisibility();

        // File input
        uploadZone.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                if (e.target.files[0]) loadImage(e.target.files[0]);
            };
            input.click();
        });

        // Drag & Drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        // Paste
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    loadImage(file);
                    break;
                }
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    originalWidth = img.width;
                    originalHeight = img.height;
                    aspectRatio = originalWidth / originalHeight;

                    previewImg.src = e.target.result;
                    previewInfo.textContent = `原始: ${originalWidth} × ${originalHeight}`;

                    targetWidth.value = originalWidth;
                    targetHeight.value = originalHeight;
                    scaleSlider.value = 100;

                    uploadZone.classList.add('hidden');
                    workspace.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Maintain aspect ratio
        let isUpdatingFromWidth = false;
        targetWidth.addEventListener('input', () => {
            if (maintainRatio.checked && originalImage) {
                isUpdatingFromWidth = true;
                targetHeight.value = Math.round(targetWidth.value / aspectRatio);
            }
        });

        targetHeight.addEventListener('input', () => {
            if (maintainRatio.checked && originalImage) {
                isUpdatingFromWidth = false;
                targetWidth.value = Math.round(targetHeight.value * aspectRatio);
            }
        });

        // Scale slider
        scaleSlider.addEventListener('input', () => {
            const scale = scaleSlider.value / 100;
            scaleValue.textContent = scaleSlider.value;

            const newWidth = Math.round(originalWidth * scale);
            const newHeight = Math.round(originalHeight * scale);

            targetWidth.value = newWidth;
            targetHeight.value = newHeight;
        });

        // Quality slider
        qualitySlider.addEventListener('input', () => {
            qualityValue.textContent = qualitySlider.value;
        });

        // Preset sizes
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                targetWidth.value = btn.dataset.width;
                targetHeight.value = btn.dataset.height;
                scaleSlider.value = 100;
            });
        });

        // Apply adjustments
        document.getElementById('applyBtn').addEventListener('click', () => {
            if (!originalImage) return;

            const canvas = document.createElement('canvas');
            canvas.width = parseInt(targetWidth.value);
            canvas.height = parseInt(targetHeight.value);

            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

            const format = outputFormat.value;
            const quality = qualitySlider.value / 100;
            const dataUrl = canvas.toDataURL(format, quality);

            previewImg.src = dataUrl;
            previewInfo.textContent = `调整后: ${canvas.width} × ${canvas.height}`;
        });

        // Download
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!previewImg.src) return;

            const ext = outputFormat.value.split('/')[1];
            const link = document.createElement('a');
            link.download = `resized_image.${ext}`;
            link.href = previewImg.src;
            link.click();
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            originalImage = null;
            previewImg.src = '';
            previewInfo.textContent = '';
            uploadZone.classList.remove('hidden');
            workspace.classList.add('hidden');
        });
    </script>
</body>
</html>
